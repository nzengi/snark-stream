[workspace]
members = ["halo2-stream"]
# Vendored halo2 forks: each its own workspace, built separately (see their dirs).
exclude = ["halo2-fork", "halo2-zcash"]

[package]
name = "snark-stream"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Out-of-core SNARK proving: KZG/MSM over a base set far larger than RAM, streamed from fast storage in a fixed memory budget."
repository = "https://github.com/nzengi/snark-stream"
readme = "README.md"
keywords = ["zk", "snark", "kzg", "msm", "proving"]
categories = ["cryptography", "mathematics"]
publish = false

[dependencies]
ark-ff = "0.5"
ark-ec = "0.5"
ark-poly = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"
ark-bn254 = "0.5"
rayon = "1"
libc = "0.2"

# Only the test oracle commits through the real deployed KZG path; the library's
# own commit is a thin MSM, so this stays out of the published dependency surface.
[dev-dependencies]
ark-poly-commit = "0.5"

[profile.release]
opt-level = 3
